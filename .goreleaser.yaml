version: 2

builds:
  - main: ./cmd/renovate-server
    binary: renovate-server
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]

sboms:
  - artifacts: archive

checksum:
  name_template: checksums.txt

# release-please creates the GitHub release and its notes before this runs.
# Republish (workflow_dispatch) replaces artifacts already uploaded for that tag.
release:
  mode: keep-existing
  replace_existing_artifacts: true

changelog:
  disable: true
