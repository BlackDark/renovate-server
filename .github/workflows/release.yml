# Publish an existing release tag (called by release-please, or re-run by hand).
# The GitHub release and its notes already exist. This workflow attaches binaries,
# the Helm chart and the signed image. It does not create the release.
# amd64 and arm64 build on native runners. Build cache is the registry (buildcache-<arch>):
# an Actions cache from tag v1.2.3 is unreadable on v1.2.4.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string
      floating_tags:
        description: Also point major.minor and latest at this image
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to republish (vX.Y.Z)
        required: true
        type: string
      floating_tags:
        description: Also point major.minor and latest at this image
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tag is semver
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag ${TAG} is not vX.Y.Z"; exit 1; }

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] actionlint rejects `$/`

  goreleaser:
    needs: [checks, version]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          # Release artifacts must not be built from a poisonable cache.
          cache: false
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}

  chart:
    needs: [checks, version]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Push chart to ghcr
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package deploy/chart/renovate-server --version "$version" --app-version "$version"
          helm push "renovate-server-${version}.tgz" oci://ghcr.io/blackdark/charts

  build:
    needs: [checks, version]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.version.result == 'success' }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          sbom: true
          provenance: mode=max
          build-args: VERSION=${{ inputs.tag }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The exact version tag always moves. major.minor and :latest move only
      # when the caller sets floating_tags. A called workflow sees the caller's
      # event (push), never workflow_call, so that name cannot select this.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.floating_tags }}
            type=raw,value=latest,enable=${{ inputs.floating_tags }}
      - name: Push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image (keyless)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${version}" | awk '/^Digest:/ {print $2; exit}')
          [ -n "$digest" ] || { echo "::error::image digest missing"; exit 1; }
          cosign sign --yes "${IMAGE}@${digest}"
