# CI from BlackDark/agent-presets snippets/ci.yml, adapted for this repo.
# - One workflow, one required check: `check`. Area jobs can be added, renamed or skipped without touching the ruleset.
#   Required checks match by NAME across ALL workflows. Do not add a second workflow with its own gate.
# - Areas: `app` runs `mise run check` and the image build; `lint` checks workflows and Renovate config.
#   PRs run only the areas they touch (docs-only PRs run neither); main, workflow_call and manual runs run every area.
#   Tags arrive via release.yml calling this workflow (workflow_call), so no tag trigger here.
# - Path detection uses plain git: a PR checkout is the merge commit, so HEAD^1..HEAD is exactly the PR's diff.
# - `check` needs `if: always()`: a skipped job reports success, so without it a failed area would leave the gate green.
#   Cancelled counts as failed, so a manually cancelled run can't be merged either.
# - Draft PRs skip `changes`; area jobs inherit the skip and `check` passes (drafts can't be merged anyway).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: "1.7.12"
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: "44.198.0"

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.areas.outputs.app }}
      lint: ${{ steps.areas.outputs.lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit and its base parent
          persist-credentials: false
      - id: areas
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            { echo "app=true"; echo "lint=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          has() { grep -qE "$1" <<< "$changed" && echo true || echo false; }
          # app: anything that is not docs, CI or Renovate config, or this file itself,
          # so a broken `mise run check` step is caught.
          app=$(has '^\.github/workflows/ci\.yml$')
          grep -qvE '^(docs/|\.github/|renovate\.json5?$|LICENSE$)|\.md$' <<< "$changed" && app=true
          {
            echo "app=$app"
            echo "lint=$(has '^(\.github/|renovate\.json5?$)')"
          } >> "$GITHUB_OUTPUT"

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - run: mise run check
      # Cross-compiled in the Dockerfile; no QEMU. Not part of `mise run check` (needs a daemon).
      - run: docker build -t renovate-server:ci .

  actionlint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color .github/workflows/*.yml

  renovate-config:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict

  zizmor:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true

  check:
    if: always()
    needs: [changes, app, actionlint, renovate-config, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
