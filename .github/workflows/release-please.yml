# A GITHUB_TOKEN tag push starts no workflows, so publish is called from here.
# No version file: goreleaser, the image and the chart take the tag.
# The release PR's CI waits for "Approve workflows to run" until an app token or PAT is set.
name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write # release PR labels
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository] actionlint rejects `$/`
    permissions:
      contents: write
      packages: write # GHCR image + Helm chart
      id-token: write # keyless cosign
    with:
      tag: ${{ needs.release-please.outputs.tag }}
      floating_tags: true
