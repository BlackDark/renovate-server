# Release PR on every push to main (from BlackDark/agent-presets).
# Conventional Commits drive the version and CHANGELOG.md. Merging the release PR tags
# vX.Y.Z and opens the GitHub release, then `publish` calls release.yml with that tag.
# A tag pushed with GITHUB_TOKEN starts no workflows, so there is no `on.push.tags` here.
# There is no version file: goreleaser, the image and the chart take the tag.
# `publish` grants every permission release.yml uses, including cosign's id-token.
# The release PR is opened with GITHUB_TOKEN, so its CI run waits until a
# maintainer chooses "Approve workflows to run". Pass a GitHub App token or PAT
# as `token` on the action if that prompt should go away. This repo has no such token.
name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write # release PR labels
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository] actionlint rejects `$/`
    permissions:
      contents: write
      packages: write # GHCR image + Helm chart
      id-token: write # keyless cosign
    with:
      tag: ${{ needs.release-please.outputs.tag }}
      floating_tags: true
